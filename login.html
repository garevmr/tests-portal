<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <!-- ВАЖНО: viewport-fit=cover -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Вход</title>

  <link rel="stylesheet" href="portal.css">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1e3a">

  <!-- iOS standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">

  <!-- Favicon (чтобы не было "планетки") -->
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
</head>

<body>

  <header class="topbar">
    <div class="brand">Вход</div>
    <div class="muted">Авторизация</div>
  </header>

  <main class="container fade-in">
    <div class="card">
      <h2>Войти</h2>

      <div class="muted">Login</div>
      <input
        id="login"
        autocomplete="username"
        style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(31,41,55,.85);background:rgba(2,6,23,.35);color:#e5e7eb;"
      >

      <div style="height:10px"></div>

      <div class="muted">Password</div>
      <input
        id="pw"
        type="password"
        autocomplete="current-password"
        style="width:100%;padding:12px;border-radius:12px;border:1px solid rgba(31,41,55,.85);background:rgba(2,6,23,.35);color:#e5e7eb;"
      >

      <div style="height:14px"></div>

      <button class="btn" id="btn">Войти</button>
      <div id="err" class="muted" style="margin-top:10px;color:#fca5a5;"></div>
    </div>
  </main>

  <footer class="footer">
    <div>Разработка: <b>Никита Давыдов</b> · © 2026</div>
  </footer>

  <script>
    const LOGIN = "test";
    const PASSWORD = "test";

    function go() {
      const l = document.getElementById('login').value;
      const p = document.getElementById('pw').value;

      if (l === LOGIN && p === PASSWORD) {
        sessionStorage.setItem('quiz_auth', '1');
        location.href = './index.html';
      } else {
        const e = document.getElementById('err');
        e.textContent = 'Неверный логин или пароль';
        const c = document.querySelector('.card');
        c.classList.add('shake');
        setTimeout(() => c.classList.remove('shake'), 400);
      }
    }

    document.getElementById('btn').onclick = go;
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
    });
  </script>

</body>
</html>
